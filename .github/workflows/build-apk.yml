name: Build APK

on:
  push:
    branches: [ main, small-apk ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK; just accept licenses
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Show APK sizes
        run: ls -lh app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk YouTubeDownloader-${{ github.ref_name }}.apk
          gh release create "${{ github.ref_name }}" YouTubeDownloader-${{ github.ref_name }}.apk \
            --title "YouTube Downloader ${{ github.ref_name }} (small APK)" \
            --notes "Small release build (~1.8 MB): R8 + resource shrinking. Signed with debug key."
