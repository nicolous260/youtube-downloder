<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nicolous 260</title>
    <link rel="stylesheet" href="/fonts/material-symbols.css" />
    <link rel="stylesheet" href="/fonts/plus-jakarta-sans.css" />
    <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body data-theme="dark">

<!-- ── Toast container ────────────────────────────────────────────────────── -->
<div id="toastContainer"></div>

<!-- ── Nav ────────────────────────────────────────────────────────────────── -->
<nav id="navbar">
    <div class="nav-wrapper">
        <div class="brand">Nicolous<span>260</span></div>
        <div class="nav-actions">
            <button class="action-icon-btn" onclick="showHistory()" title="Download history">
                <span class="material-symbols-rounded">history</span>
            </button>
            <button class="action-icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle theme">
                <span class="material-symbols-rounded" id="themeIcon">light_mode</span>
            </button>
            <button class="action-icon-btn" onclick="openSearch()" title="Search (/)">
                <span class="material-symbols-rounded">search</span>
            </button>
        </div>
    </div>

    <div class="search-overlay" id="searchOverlay">
        <button class="back-btn" onclick="closeSearch()">
            <span class="material-symbols-rounded">arrow_back</span>
        </button>
        <div class="inputs-container">
            <div class="input-field-wrapper">
                <span class="material-symbols-rounded" style="color:var(--text-sub);font-size:20px;">link</span>
                <input type="text" id="query" class="search-input"
                    placeholder="Search or paste a YouTube link…"
                    onkeydown="handleSearchKey(event)" autocomplete="off" spellcheck="false">
                <button class="clear-btn" id="clearBtn" onclick="clearSearch()" style="display:none;">
                    <span class="material-symbols-rounded" style="font-size:18px;width:18px;height:18px;">close</span>
                </button>
            </div>
        </div>
        <button class="shazam-btn" id="shazamBtn" onclick="startRecognition()" title="Recognise a song">
            <span class="material-symbols-rounded">graphic_eq</span>
        </button>
    </div>
</nav>

<!-- ── Song Recognition Modal ─────────────────────────────────────────────── -->
<div id="recognizeModal">
    <div class="recognize-sheet" id="recognizeSheet">
        <button class="recognize-close" onclick="closeRecognizeModal()">
            <span class="material-symbols-rounded" style="font-size:20px;width:20px;height:20px;">close</span>
        </button>
        <div id="recognizeContent"></div>
    </div>
</div>

<!-- ── History Drawer ─────────────────────────────────────────────────────── -->
<div id="historyDrawer" class="drawer">
    <div class="drawer-header">
        <span class="drawer-title">Download History</span>
        <div style="display:flex;gap:4px;">
            <button class="action-icon-btn" onclick="clearHistory()" title="Clear history">
                <span class="material-symbols-rounded" style="font-size:20px;width:20px;height:20px;">delete_sweep</span>
            </button>
            <button class="action-icon-btn" onclick="closeHistory()">
                <span class="material-symbols-rounded" style="font-size:20px;width:20px;height:20px;">close</span>
            </button>
        </div>
    </div>
    <div id="historyList" class="history-list"></div>
</div>
<div id="drawerBackdrop" class="drawer-backdrop" onclick="closeHistory()"></div>

<!-- ── Main content ───────────────────────────────────────────────────────── -->
<div class="main-content">
    <div id="videoGrid" class="video-grid">
        <div class="empty-state" id="emptyState">
            <span class="material-symbols-rounded" style="font-size:52px;width:52px;height:52px;color:var(--border);">youtube_activity</span>
            <p>What would you like to find today?</p>
            <p style="font-size:12px;margin-top:4px;">Tap <strong>search</strong> or press <kbd>/</kbd></p>
        </div>
    </div>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
